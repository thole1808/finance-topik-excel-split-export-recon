name: Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Excel engine
        run: python -c "import fastexcel, polars, xlsxwriter; print('Excel engine ready:', fastexcel.__file__)"

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          $workspace = (Get-Location).Path
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --windowed `
            --onedir `
            --name ReconBuilder `
            --icon "$workspace\assets\recon-builder.ico" `
            --collect-all fastexcel `
            --hidden-import fastexcel `
            --paths "$workspace" `
            --add-data "$workspace\src\ref_styles.json;src" `
            --add-data "$workspace\src\fee_tables.json;src" `
            --add-data "$workspace\src\reference_data.json;src" `
            --add-data "$workspace\assets\batik-watermark.png;assets" `
            --distpath dist `
            --workpath build/pyinstaller `
            --specpath build `
            app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          $version = python -c "from src.version import __version__; print(__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "scripts\windows\ReconBuilder.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\ReconBuilder-Setup.exe")) { throw "Installer output was not created" }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBuilder-Windows-Setup
          path: dist/ReconBuilder-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create versioned release and history
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from src.version import __version__; print(__version__)"
          $tag = "v$version"
          if ($env:GITHUB_REF.StartsWith("refs/tags/") -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Git tag $env:GITHUB_REF_NAME does not match application version $tag"
          }
          $dmg = Get-ChildItem -Path . -Filter "ReconBuilder-v$version-*.dmg" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $dmg) { throw "Versioned DMG for $version was not found" }
          $pkg = Get-ChildItem -Path . -Filter "ReconBuilder-v$version-*.pkg" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $pkg) { throw "Versioned macOS installer package for $version was not found" }
          $releaseAssets = @(
            "dist\ReconBuilder-Setup.exe",
            $dmg.FullName,
            $pkg.FullName,
            "docs\flow-recon-finance.png",
            "docs\flow-recon-finance.jpg"
          )
          $checksums = foreach ($file in $releaseAssets) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          [System.IO.File]::WriteAllLines(
            "dist\SHA256SUMS.txt", $checksums, [System.Text.Encoding]::ASCII
          )
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping its published assets."
            exit 0
          }
          $releaseArgs = @(
            "release", "create", $tag
          ) + $releaseAssets + @(
            "dist\SHA256SUMS.txt",
            "--target", "$env:GITHUB_SHA",
            "--title", "Recon Builder $tag",
            "--generate-notes"
          )
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
