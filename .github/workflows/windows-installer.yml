name: Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verify Excel engine
        run: python3 -c "import fastexcel, polars, xlsxwriter; print('Excel engine ready:', fastexcel.__file__)"

      - name: Build DMG and PKG
        run: bash scripts/build_dmg.sh
      - name: Locate versioned artifacts
        id: artifacts
        run: |
          VERSION=$(python3 -c "from src.version import __version__; print(__version__)")
          DMG=$(ls dist/ReconBuilder-v${VERSION}-*.dmg | sort | tail -1)
          PKG=$(ls dist/ReconBuilder-v${VERSION}-*.pkg | sort | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBuilder-macOS-DMG
          path: ${{ steps.artifacts.outputs.dmg }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBuilder-macOS-PKG
          path: ${{ steps.artifacts.outputs.pkg }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish macOS assets to release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.artifacts.outputs.version }}"
          TAG="v${VERSION}"
          DMG="${{ steps.artifacts.outputs.dmg }}"
          PKG="${{ steps.artifacts.outputs.pkg }}"

          # Buat release bila belum ada (Windows job mungkin belum selesai)
          if ! gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Recon Builder $TAG" \
              --generate-notes
          fi

          # Upload DMG + PKG; clobber jika sudah ada dari run sebelumnya
          gh release upload "$TAG" "$DMG" "$PKG" \
            --clobber

  build-windows-installer:
    runs-on: windows-latest
    needs: build-macos-dmg
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Excel engine
        run: python -c "import fastexcel, polars, xlsxwriter; print('Excel engine ready:', fastexcel.__file__)"

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          $workspace = (Get-Location).Path
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --windowed `
            --onedir `
            --name ReconBuilder `
            --icon "$workspace\assets\recon-builder.ico" `
            --collect-all fastexcel `
            --hidden-import fastexcel `
            --collect-all PIL `
            --hidden-import PIL `
            --paths "$workspace" `
            --add-data "$workspace\src\ref_styles.json;src" `
            --add-data "$workspace\src\fee_tables.json;src" `
            --add-data "$workspace\src\reference_data.json;src" `
            --add-data "$workspace\assets\batik-watermark.png;assets" `
            --distpath dist `
            --workpath build/pyinstaller `
            --specpath build `
            app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          $version = python -c "from src.version import __version__; print(__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "scripts\windows\ReconBuilder.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\ReconBuilder-Setup.exe")) { throw "Installer output was not created" }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBuilder-Windows-Setup
          path: dist/ReconBuilder-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ReconBuilder-macOS-DMG
          path: dist/macos-artifacts

      - name: Download macOS PKG artifact
        uses: actions/download-artifact@v4
        with:
          name: ReconBuilder-macOS-PKG
          path: dist/macos-artifacts

      - name: Publish release with all assets and SHA256SUMS
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from src.version import __version__; print(__version__)"
          $tag = "v$version"
          if ($env:GITHUB_REF.StartsWith("refs/tags/") -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Git tag $env:GITHUB_REF_NAME does not match application version $tag"
          }

          # Temukan DMG dan PKG yang sudah didownload dari macOS job
          $dmg = Get-ChildItem -Path "dist\macos-artifacts" -Filter "*.dmg" -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dmg) { throw "DMG untuk $version tidak ditemukan di artifact macOS." }
          $pkg = Get-ChildItem -Path "dist\macos-artifacts" -Filter "*.pkg" -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pkg) { throw "PKG untuk $version tidak ditemukan di artifact macOS." }

          # Kumpulkan semua file untuk checksum
          $releaseAssets = @(
            "dist\ReconBuilder-Setup.exe",
            $dmg.FullName,
            $pkg.FullName,
            "docs\flow-recon-finance.png",
            "docs\flow-recon-finance.jpg"
          )

          # Generate SHA256SUMS.txt dari semua platform sekaligus
          $checksums = foreach ($file in $releaseAssets) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          [System.IO.File]::WriteAllLines(
            "dist\SHA256SUMS.txt", $checksums, [System.Text.Encoding]::ASCII
          )

          # Buat release jika belum ada
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target "$env:GITHUB_SHA" `
              --title "Recon Builder $tag" `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Gagal membuat release $tag" }
          }

          # Upload semua asset sekaligus termasuk SHA256SUMS.txt
          $uploadArgs = @("release", "upload", $tag) + $releaseAssets + @(
            "dist\SHA256SUMS.txt", "--clobber"
          )
          & gh @uploadArgs
          if ($LASTEXITCODE -ne 0) { throw "Gagal upload asset ke release $tag" }
