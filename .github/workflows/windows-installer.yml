name: Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── macOS: build DMG + PKG ──────────────────────────────────────────────────
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Cache PyInstaller build
        uses: actions/cache@v4
        with:
          path: build/pyinstaller
          key: pyinstaller-macos-${{ hashFiles('requirements.txt', 'src/**/*.py', 'app.py') }}
          restore-keys: pyinstaller-macos-

      - name: Build DMG and PKG
        run: bash scripts/build_dmg.sh

      - name: Locate versioned artifacts
        id: artifacts
        run: |
          VERSION=$(python3 -c "from src.version import __version__; print(__version__)")
          DMG=$(ls dist/ReconBuilder-v${VERSION}-*.dmg | sort | tail -1)
          PKG=$(ls dist/ReconBuilder-v${VERSION}-*.pkg | sort | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBuilder-macOS-DMG
          path: ${{ steps.artifacts.outputs.dmg }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBuilder-macOS-PKG
          path: ${{ steps.artifacts.outputs.pkg }}
          if-no-files-found: error
          retention-days: 7

  # ── Windows: build EXE ─────────────────────────────────────────────────────
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Cache PyInstaller build
        uses: actions/cache@v4
        with:
          path: build/pyinstaller
          key: pyinstaller-windows-${{ hashFiles('requirements.txt', 'src/**/*.py', 'app.py') }}
          restore-keys: pyinstaller-windows-

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          $workspace = (Get-Location).Path
          python -m PyInstaller `
            --noconfirm `
            --windowed `
            --onedir `
            --name ReconBuilder `
            --icon "$workspace\assets\recon-builder.ico" `
            --collect-all fastexcel `
            --hidden-import fastexcel `
            --collect-all PIL `
            --hidden-import PIL `
            --collect-all certifi `
            --hidden-import certifi `
            --paths "$workspace" `
            --add-data "$workspace\src\ref_styles.json;src" `
            --add-data "$workspace\src\fee_tables.json;src" `
            --add-data "$workspace\src\reference_data.json;src" `
            --add-data "$workspace\assets\batik-watermark.png;assets" `
            --distpath dist `
            --workpath build/pyinstaller `
            --specpath build `
            app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          $version = python -c "from src.version import __version__; print(__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "scripts\windows\ReconBuilder.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\ReconBuilder-Setup.exe")) { throw "Installer output was not created" }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBuilder-Windows-Setup
          path: dist/ReconBuilder-Setup.exe
          if-no-files-found: error
          retention-days: 7

  # ── Publish: tunggu kedua job, generate SHA256SUMS, upload release ──────────
  publish-release:
    runs-on: ubuntu-latest
    needs: [build-macos-dmg, build-windows-installer]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: Generate SHA256SUMS and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "from src.version import __version__; print(__version__)")
          TAG="v${VERSION}"

          # Pastikan tag sesuai versi jika dipush via tag
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match app version $TAG" >&2
            exit 1
          fi

          # Temukan semua artifact
          EXE=$(find dist/artifacts/ReconBuilder-Windows-Setup -name "*.exe" | head -1)
          DMG=$(find dist/artifacts/ReconBuilder-macOS-DMG -name "*.dmg" | head -1)
          PKG=$(find dist/artifacts/ReconBuilder-macOS-PKG -name "*.pkg" | head -1)

          for f in "$EXE" "$DMG" "$PKG"; do
            [[ -f "$f" ]] || { echo "Artifact tidak ditemukan: $f" >&2; exit 1; }
          done

          # Generate SHA256SUMS.txt
          sha256sum "$EXE" "$DMG" "$PKG" \
            docs/flow-recon-finance.png \
            docs/flow-recon-finance.jpg \
            | sed 's|dist/artifacts/[^/]*/||g; s|docs/||g' \
            > dist/SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ===" && cat dist/SHA256SUMS.txt

          # Buat release jika belum ada
          if ! gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Recon Builder $TAG" \
              --generate-notes
          fi

          # Upload semua asset sekaligus
          gh release upload "$TAG" \
            "$EXE" "$DMG" "$PKG" \
            docs/flow-recon-finance.png \
            docs/flow-recon-finance.jpg \
            dist/SHA256SUMS.txt \
            --clobber
