name: Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          $workspace = (Get-Location).Path
          python -m PyInstaller `
            --noconfirm `
            --windowed `
            --onedir `
            --name ReconBuilder `
            --icon "$workspace\assets\recon-builder.ico" `
            --collect-all fastexcel `
            --hidden-import fastexcel `
            --collect-all certifi `
            --hidden-import certifi `
            --paths "$workspace" `
            --add-data "$workspace\src\ref_styles.json;src" `
            --add-data "$workspace\src\fee_tables.json;src" `
            --add-data "$workspace\src\reference_data.json;src" `
            --distpath dist/.build `
            --workpath dist/.build/pyinstaller `
            --specpath dist/.build/spec `
            app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          $version = python -c "from src.version import __version__; print(__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "scripts\windows\ReconBuilder.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\ReconBuilder-Setup.exe")) { throw "Installer output was not created" }
          Remove-Item "dist/.build" -Recurse -Force

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBuilder-Windows-Setup
          path: dist/ReconBuilder-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from src.version import __version__; print(__version__)"
          gh release upload "v$version" "dist/ReconBuilder-Setup.exe" --clobber
