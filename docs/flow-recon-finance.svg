<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6685a1"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#159b87"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17365d; }
      .title { font-size: 48px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #5d7591; }
      .heading { font-size: 27px; font-weight: 700; }
      .body { font-size: 21px; fill: #506985; }
      .small { font-size: 18px; fill: #506985; }
      .tiny { font-size: 16px; fill: #61748b; }
      .card { fill: #fff; stroke: #d2deea; stroke-width: 2; }
      .line { fill: none; stroke: #6685a1; stroke-width: 5; marker-end: url(#arrow); }
      .teal { fill: none; stroke: #159b87; stroke-width: 5; marker-end: url(#arrow-teal); }
    </style>
  </defs>
  <rect width="1800" height="1500" fill="#f3f7fb"/>

  <text x="70" y="78" class="title">FLOW BARU · RECON BUILDER</text>
  <text x="72" y="119" class="subtitle">Versi 1.2.42 · Data BO Biller di kiri · Data Vendor di kanan · tanpa sheet Records pada output</text>

  <!-- Input periods -->
  <rect x="70" y="170" width="790" height="320" rx="24" class="card"/>
  <rect x="70" y="170" width="14" height="320" rx="7" fill="#edaa39"/>
  <text x="108" y="218" class="heading">1 · Sumber transaksi</text>
  <rect x="105" y="245" width="720" height="95" rx="16" fill="#fff8eb" stroke="#efd39c" stroke-width="2"/>
  <text x="130" y="280" class="body" font-weight="700">BACKDATE (opsional)</text>
  <text x="130" y="314" class="small">BO: Backdate · RECON  |  Vendor: Backdate · LB / RB</text>
  <rect x="105" y="360" width="720" height="95" rx="16" fill="#eff8ff" stroke="#b9d6ed" stroke-width="2"/>
  <text x="130" y="395" class="body" font-weight="700">ENDDATE</text>
  <text x="130" y="429" class="small">BO: file Recon · Records  |  Vendor: upload LB / upload RB</text>
  <text x="108" y="472" class="tiny">File Recon juga memuat Summary untuk validasi / preview input.</text>

  <!-- Input validation -->
  <rect x="70" y="535" width="790" height="160" rx="24" class="card"/>
  <rect x="70" y="535" width="14" height="160" rx="7" fill="#398bc4"/>
  <text x="108" y="583" class="heading">2 · Validasi dan normalisasi</text>
  <text x="108" y="622" class="body">Header, format tanggal, nomor pelanggan, nominal, status, dan referensi.</text>
  <text x="108" y="658" class="small">Backdate dipasangkan hanya dengan Backdate; Enddate hanya dengan Enddate.</text>

  <!-- Pairing logic -->
  <rect x="940" y="170" width="790" height="525" rx="24" class="card"/>
  <rect x="940" y="170" width="14" height="525" rx="7" fill="#159b87"/>
  <text x="980" y="218" class="heading">3 · Pemadanan satu-ke-satu</text>
  <circle cx="1000" cy="270" r="17" fill="#159b87"/>
  <text x="994" y="277" font-size="18" fill="#fff" font-weight="700">1</text>
  <text x="1035" y="278" class="body">Referensi transaksi unik: BO Vendor Ref ↔ referensi Vendor</text>
  <circle cx="1000" cy="327" r="17" fill="#398bc4"/>
  <text x="994" y="334" font-size="18" fill="#fff" font-weight="700">2</text>
  <text x="1035" y="335" class="body">Fallback: nomor pelanggan + nominal + waktu/tanggal</text>
  <circle cx="1000" cy="384" r="17" fill="#398bc4"/>
  <text x="994" y="391" font-size="18" fill="#fff" font-weight="700">3</text>
  <text x="1035" y="392" class="body">Kandidat harus unik; nomor, tanggal, dan status diperiksa</text>
  <line x1="980" y1="425" x2="1690" y2="425" stroke="#d2deea" stroke-width="2"/>
  <text x="980" y="466" class="heading">Hasil pengecekan pasangan</text>
  <rect x="980" y="488" width="710" height="48" rx="12" fill="#eaf7ee"/>
  <text x="1000" y="520" class="small" font-weight="700">COCOK</text>
  <text x="1150" y="520" class="small">Referensi dan data transaksi konsisten</text>
  <rect x="980" y="545" width="710" height="48" rx="12" fill="#fff5df"/>
  <text x="1000" y="577" class="small" font-weight="700">AMOUNT MISMATCH</text>
  <text x="1220" y="577" class="small">Referensi kuat, nominal berbeda; ditandai</text>
  <rect x="980" y="602" width="710" height="58" rx="12" fill="#fceced"/>
  <text x="1000" y="637" class="small" font-weight="700">NO BO / NO VENDOR MATCH</text>
  <text x="1275" y="637" class="small">Tidak dipasangkan secara tebakan</text>

  <!-- flow arrows -->
  <path d="M860 330 L920 330 L920 255 L940 255" class="teal"/>
  <path d="M465 490 L465 525" class="line"/>
  <path d="M860 615 L900 615 L900 480 L940 480" class="teal"/>

  <!-- Output shape -->
  <rect x="70" y="760" width="1660" height="490" rx="24" class="card"/>
  <rect x="70" y="760" width="14" height="490" rx="7" fill="#17365d"/>
  <text x="108" y="808" class="heading">4 · Generate workbook · hanya sheet LB dan RB</text>
  <text x="108" y="845" class="small">Backdate tampil sebelum Enddate · transaksi Enddate pukul 23:00+ masuk blok For tomorrow</text>

  <!-- two-side example -->
  <rect x="108" y="875" width="750" height="292" rx="18" fill="#f0f7ff" stroke="#b9d6ed" stroke-width="2"/>
  <rect x="108" y="875" width="750" height="58" rx="18" fill="#dceeff"/>
  <text x="135" y="913" class="heading">KIRI · BO BILLER</text>
  <text x="135" y="972" class="body">Datetime · Product · Billing Number · Billing Name</text>
  <text x="135" y="1013" class="body">Ref · Vendor Ref · Amount · Fee · Status</text>
  <text x="135" y="1070" class="small">Nilai BO tetap dari Records (Enddate) / RECON (Backdate)</text>
  <text x="135" y="1112" class="small">Recon Result menandai MATCHED atau mismatch</text>

  <rect x="938" y="875" width="750" height="292" rx="18" fill="#effaf7" stroke="#b2dfd5" stroke-width="2"/>
  <rect x="938" y="875" width="750" height="58" rx="18" fill="#d9f2eb"/>
  <text x="965" y="913" class="heading">KANAN · VENDOR</text>
  <text x="965" y="972" class="body">LB: Idpel · Nama · Ref ID · Tagihan · Harga</text>
  <text x="965" y="1013" class="body">RB: ID Trx · Pelanggan · SN · Ref · Nominal</text>
  <text x="965" y="1070" class="small">Nilai Vendor tetap dari upload LB/RB (Enddate)</text>
  <text x="965" y="1112" class="small">atau sheet LB/RB pada workbook Backdate</text>

  <rect x="108" y="1182" width="1580" height="42" rx="12" fill="#fff8eb"/>
  <text x="132" y="1210" class="small">Subtotal memakai SUM · pasangan meragukan tetap terpisah · tidak ada sheet Summary/Records pada file hasil</text>

  <!-- Footer -->
  <text x="72" y="1315" class="heading">5 · Finance review</text>
  <text x="72" y="1352" class="body">Periksa pasangan, mismatch nominal, baris tanpa pasangan, subtotal, tanggal, dan status.</text>
  <text x="72" y="1410" class="small">File hasil .xlsx → folder output lokal · updater mengambil release publik dan memeriksa SHA-256.</text>
  <text x="72" y="1460" class="tiny">Recon Builder · Flow data v1.2.42</text>
</svg>
