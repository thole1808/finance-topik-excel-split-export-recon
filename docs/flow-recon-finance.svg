<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6685a1"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#8b73cf"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17365d; }
      .title { font-size: 46px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #5d7591; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 18px; fill: #506985; }
      .small { font-size: 16px; fill: #506985; }
      .card { fill: #ffffff; stroke: #d2deea; stroke-width: 2; }
      .connector { fill: none; stroke: #6685a1; stroke-width: 5; marker-end: url(#arrow); }
      .reference { fill: none; stroke: #8b73cf; stroke-width: 5; marker-end: url(#arrow-purple); }
    </style>
  </defs>
  <rect width="1800" height="1800" fill="#f3f7fb"/>

  <text x="76" y="76" class="title">ALUR RECON BUILDER</text>
  <text x="78" y="116" class="subtitle">Versi 1.2.4 · Upload → preview per sheet → proses → hasil bertimestamp + riwayat</text>

  <!-- Upload sources -->
  <rect x="76" y="190" width="350" height="135" rx="20" class="card"/>
  <rect x="76" y="190" width="13" height="135" rx="7" fill="#20b49f"/>
  <text x="106" y="231" class="heading">Upload LB</text>
  <text x="106" y="264" class="body">.xlsx · sheet pertama</text>
  <text x="106" y="292" class="body">Sumber transaksi Loket Bayar</text>

  <rect x="76" y="365" width="350" height="135" rx="20" class="card"/>
  <rect x="76" y="365" width="13" height="135" rx="7" fill="#f2a93b"/>
  <text x="106" y="406" class="heading">Upload RB</text>
  <text x="106" y="439" class="body">.xlsx · sheet pertama</text>
  <text x="106" y="467" class="body">Sumber transaksi Rajabiller</text>

  <rect x="76" y="540" width="350" height="135" rx="20" class="card"/>
  <rect x="76" y="540" width="13" height="135" rx="7" fill="#8b73cf"/>
  <text x="106" y="581" class="heading">Upload Recon referensi</text>
  <text x="106" y="614" class="body">.xlsx · wajib Summary + Records</text>
  <text x="106" y="642" class="body">Hanya ditampilkan untuk ditinjau</text>

  <!-- Validation -->
  <rect x="500" y="235" width="335" height="280" rx="22" class="card"/>
  <rect x="500" y="235" width="13" height="280" rx="7" fill="#3591d0"/>
  <text x="532" y="280" class="heading">Validasi input</text>
  <text x="532" y="322" class="body">• Header wajib harus cocok</text>
  <text x="532" y="358" class="body">• File harus Excel .xlsx</text>
  <text x="532" y="394" class="body">• Footer RB non-numerik dibuang</text>
  <text x="532" y="442" class="small">Input tidak valid → proses dihentikan</text>

  <!-- Preview/edit -->
  <rect x="900" y="235" width="340" height="280" rx="22" class="card"/>
  <rect x="900" y="235" width="13" height="280" rx="7" fill="#8b73cf"/>
  <text x="932" y="280" class="heading">Preview &amp; edit</text>
  <text x="932" y="322" class="body">• Telusuri semua baris LB/RB</text>
  <text x="932" y="358" class="body">• Cari dan edit sebelum export</text>
  <text x="932" y="394" class="body">• Edit LB/RB ikut dihitung ulang</text>
  <text x="932" y="442" class="small">Recon referensi: Summary/Records read-only</text>

  <!-- Process and fee lookup -->
  <rect x="1300" y="190" width="425" height="455" rx="22" class="card"/>
  <rect x="1300" y="190" width="13" height="455" rx="7" fill="#20b49f"/>
  <text x="1332" y="235" class="heading">Proses data (Polars)</text>
  <text x="1332" y="274" class="body">Status: SUCCESS di atas FAILED</text>
  <text x="1332" y="308" class="body">Jam ≥ 23:00 → bagian For tomorrow</text>
  <text x="1332" y="342" class="body">Ringkasan Records dihitung dari LB/RB</text>
  <line x1="1332" y1="365" x2="1692" y2="365" stroke="#d2deea" stroke-width="2"/>
  <text x="1332" y="402" class="heading">Lookup fee per transaksi</text>
  <text x="1332" y="438" class="small">1. reference_data: kode produk + nominal</text>
  <text x="1332" y="469" class="small">2. fee_tables: kode produk</text>
  <text x="1332" y="500" class="small">3. Field fee sumber LB, jika tersedia</text>
  <rect x="1328" y="523" width="365" height="87" rx="13" fill="#fff7e6" stroke="#f0c36d" stroke-width="2"/>
  <text x="1345" y="555" class="small" font-weight="700">Jika profil tidak ditemukan dan input tak</text>
  <text x="1345" y="580" class="small" font-weight="700">punya fee, sel tetap kosong—bukan angka 0.</text>

  <!-- Reference preview lane -->
  <rect x="500" y="565" width="740" height="110" rx="20" fill="#f8f5ff" stroke="#d8cef5" stroke-width="2"/>
  <text x="530" y="606" class="heading">Recon referensi → pratinjau saja</text>
  <text x="530" y="640" class="body">Preview saja; Summary/Records output dihitung ulang dari upload LB/RB.</text>

  <!-- Main connectors -->
  <path d="M426 257 L500 300" class="connector"/>
  <path d="M426 432 L500 412" class="connector"/>
  <path d="M835 375 L900 375" class="connector"/>
  <path d="M1240 375 L1300 375" class="connector"/>
  <path d="M426 607 L500 607" class="reference"/>
  <path d="M870 565 L870 535 L1065 535 L1065 515" class="reference"/>

  <!-- Export -->
  <path d="M1512 645 L1512 730" class="connector"/>
  <rect x="1215" y="730" width="510" height="100" rx="20" class="card"/>
  <rect x="1215" y="730" width="13" height="100" rx="7" fill="#f2a93b"/>
  <text x="1248" y="772" class="heading">Export workbook Excel (.xlsx)</text>
  <text x="1248" y="804" class="body">XlsxWriter · formula, format, filter, warna status</text>

  <!-- Output sheets -->
  <path d="M1470 830 L1470 865 L281 865 L281 900" class="connector"/>
  <path d="M1470 865 L701 865 L701 900" class="connector"/>
  <path d="M1470 865 L1121 865 L1121 900" class="connector"/>
  <path d="M1470 865 L1541 865 L1541 900" class="connector"/>

  <rect x="76" y="900" width="410" height="125" rx="20" class="card"/>
  <rect x="76" y="900" width="13" height="125" rx="7" fill="#3591d0"/>
  <text x="108" y="944" class="heading">Summary</text>
  <text x="108" y="981" class="body">Jumlah dan nominal per kategori/status</text>

  <rect x="496" y="900" width="410" height="125" rx="20" class="card"/>
  <rect x="496" y="900" width="13" height="125" rx="7" fill="#3591d0"/>
  <text x="528" y="944" class="heading">Records</text>
  <text x="528" y="981" class="body">Gabungan transaksi LB + RB dan fee</text>

  <rect x="916" y="900" width="410" height="125" rx="20" class="card"/>
  <rect x="916" y="900" width="13" height="125" rx="7" fill="#3591d0"/>
  <text x="948" y="944" class="heading">LB</text>
  <text x="948" y="981" class="body">Sumber LB + kolom recon dan formula</text>

  <rect x="1336" y="900" width="410" height="125" rx="20" class="card"/>
  <rect x="1336" y="900" width="13" height="125" rx="7" fill="#3591d0"/>
  <text x="1368" y="944" class="heading">RB</text>
  <text x="1368" y="981" class="body">Sumber RB + kolom recon dan formula</text>

  <!-- Finance review and historical root cause -->
  <path d="M281 1025 L281 1070 L900 1070 L900 1100" class="connector"/>
  <path d="M701 1025 L701 1070" fill="none" stroke="#6685a1" stroke-width="5"/>
  <path d="M1121 1025 L1121 1070" fill="none" stroke="#6685a1" stroke-width="5"/>
  <path d="M1541 1025 L1541 1070 L900 1070" fill="none" stroke="#6685a1" stroke-width="5"/>
  <rect x="500" y="1100" width="800" height="100" rx="20" class="card"/>
  <rect x="500" y="1100" width="13" height="100" rx="7" fill="#17365d"/>
  <text x="535" y="1143" class="heading">Pemeriksaan Finance</text>
  <text x="535" y="1177" class="body">Cek jumlah, fee kosong, status, nominal, tanggal, dan jam 23:00+</text>

  <rect x="76" y="1240" width="1670" height="190" rx="20" fill="#eef5ff" stroke="#aac9e8" stroke-width="2"/>
  <text x="108" y="1282" class="heading">Perbaikan 1.1.11 — penyebab fee RB sempat kosong</text>
  <text x="108" y="1320" class="body">Output sebelumnya dibangun ulang dari LB/RB; recon referensi hanya dipreview, jadi fee di Records acuan tidak otomatis disalin.</text>
  <text x="108" y="1355" class="body">Transaksi RB tidak punya kolom fee, dan pasangan kode/nominal AXD10H|66750, AXD2H|25650, AXBR8H|72105 belum terdaftar.</text>
  <text x="108" y="1390" class="body">Acuan 15 Okt mengonfirmasi fee 1.500 / 750 / 750 / 0; profil tersebut kini tercatat agar export baru terisi.</text>

  <text x="76" y="1468" class="small">Catatan: label MATCHED/INTERNAL saat ini berasal dari status, bukan hasil pencocokan silang settlement LB ↔ RB.</text>

  <rect x="76" y="1510" width="1670" height="210" rx="20" fill="#eaf4f8" stroke="#aac9e8" stroke-width="2"/>
  <text x="108" y="1555" class="heading">Operator · proses · pembaruan</text>
  <text x="108" y="1595" class="body">Header menampilkan versi APP/RELEASE dan tombol Update; jam mengikuti zona lokal dengan nama hari/bulan Indonesia.</text>
  <text x="108" y="1632" class="body">Backdate LB/RB/RECON punya tab sendiri; Preview Semua menampilkan semua baris.</text>
  <text x="108" y="1669" class="body">SQLite mencatat IP/MAC masked; voice Indonesia memberi status generate dan tombol Tes Suara mengecek speaker.</text>
  <text x="108" y="1702" class="small">Ikon ikut installer. Log lokal dapat dihapus pemilik perangkat; lihat roadmap mobile untuk rencana APK/iOS.</text>
</svg>
