<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#54728e"/>
    </marker>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#16836e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183858; }
      .title { font-size: 46px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #58718a; }
      .section { font-size: 29px; font-weight: 700; }
      .card-title { font-size: 24px; font-weight: 700; }
      .body { font-size: 20px; fill: #435e78; }
      .small { font-size: 17px; fill: #526a81; }
      .tiny { font-size: 15px; fill: #60768c; }
      .white { fill: #fff; }
      .card { fill: #fff; stroke: #d1deea; stroke-width: 2; }
      .line { fill: none; stroke: #54728e; stroke-width: 5; marker-end: url(#arrow); }
      .green-line { fill: none; stroke: #16836e; stroke-width: 5; marker-end: url(#green-arrow); }
    </style>
  </defs>
  <rect width="1800" height="1900" fill="#f3f7fb"/>

  <text x="70" y="76" class="title">FLOWCHART · CARA KERJA RECON BUILDER</text>
  <text x="72" y="118" class="subtitle">Dari empat input Excel sampai file hasil yang siap diperiksa.</text>

  <!-- Four current upload controls -->
  <text x="70" y="174" class="section">1 · Pilih empat sumber data</text>
  <rect x="70" y="198" width="390" height="300" rx="20" class="card"/>
  <rect x="70" y="198" width="390" height="60" rx="20" fill="#fff0d6"/>
  <rect x="70" y="238" width="390" height="20" fill="#fff0d6"/>
  <circle cx="104" cy="228" r="21" fill="#d99524"/><text x="98" y="235" font-size="20" font-weight="700" class="white">1</text>
  <text x="139" y="236" class="card-title">FILE BACKDATE</text>
  <text x="96" y="296" class="body" font-weight="700">Opsional · satu workbook</text>
  <text x="96" y="338" class="small">Sheet LB dan RB = data Vendor</text>
  <text x="96" y="368" class="small">Backdate.</text>
  <text x="96" y="410" class="small">Sheet RECON = data BO Biller</text>
  <text x="96" y="440" class="small">Backdate.</text>
  <text x="96" y="475" class="tiny">Jika dipakai, ketiga sheet wajib ada.</text>

  <rect x="500" y="198" width="390" height="300" rx="20" class="card"/>
  <rect x="500" y="198" width="390" height="60" rx="20" fill="#e6f4ff"/>
  <rect x="500" y="238" width="390" height="20" fill="#e6f4ff"/>
  <circle cx="534" cy="228" r="21" fill="#398bc4"/><text x="528" y="235" font-size="20" font-weight="700" class="white">2</text>
  <text x="569" y="236" class="card-title">UPLOAD LB</text>
  <text x="526" y="305" class="body" font-weight="700">Vendor LB · Enddate</text>
  <text x="526" y="348" class="small">Excel .xlsx, data dari sheet</text>
  <text x="526" y="378" class="small">pertama.</text>
  <text x="526" y="425" class="small">Gabungkan tanggal Enddate</text>
  <text x="526" y="455" class="small">di file ini sebelum upload.</text>

  <rect x="930" y="198" width="390" height="300" rx="20" class="card"/>
  <rect x="930" y="198" width="390" height="60" rx="20" fill="#e8f7f2"/>
  <rect x="930" y="238" width="390" height="20" fill="#e8f7f2"/>
  <circle cx="964" cy="228" r="21" fill="#18866f"/><text x="958" y="235" font-size="20" font-weight="700" class="white">3</text>
  <text x="999" y="236" class="card-title">UPLOAD RB</text>
  <text x="956" y="305" class="body" font-weight="700">Vendor RB · Enddate</text>
  <text x="956" y="348" class="small">Excel .xlsx, data dari sheet</text>
  <text x="956" y="378" class="small">pertama.</text>
  <text x="956" y="425" class="small">Gabungkan tanggal Enddate</text>
  <text x="956" y="455" class="small">di file ini sebelum upload.</text>

  <rect x="1360" y="198" width="370" height="300" rx="20" class="card"/>
  <rect x="1360" y="198" width="370" height="60" rx="20" fill="#f0ebff"/>
  <rect x="1360" y="238" width="370" height="20" fill="#f0ebff"/>
  <circle cx="1394" cy="228" r="21" fill="#7658bd"/><text x="1388" y="235" font-size="20" font-weight="700" class="white">4</text>
  <text x="1429" y="236" class="card-title">UPLOAD RECON</text>
  <text x="1386" y="305" class="body" font-weight="700">BO Biller · Enddate</text>
  <text x="1386" y="348" class="small">Sheet Records = transaksi</text>
  <text x="1386" y="378" class="small">untuk dicocokkan.</text>
  <text x="1386" y="425" class="small">Sheet Summary hanya untuk</text>
  <text x="1386" y="455" class="small">ditinjau sebagai referensi.</text>

  <rect x="70" y="520" width="1660" height="64" rx="16" fill="#fff4dc" stroke="#efd49b" stroke-width="2"/>
  <text x="96" y="559" class="small" font-weight="700">Punya banyak tanggal?</text>
  <text x="310" y="559" class="small">Satukan dulu per sumber ke satu file. Aplikasi tidak menerima banyak file terpisah untuk satu jenis upload.</text>

  <!-- validate and preview -->
  <path d="M900 584 L900 625" class="line"/>
  <rect x="70" y="640" width="790" height="280" rx="22" class="card"/>
  <rect x="70" y="640" width="790" height="62" rx="22" fill="#e9f0f7"/>
  <rect x="70" y="680" width="790" height="22" fill="#e9f0f7"/>
  <text x="104" y="680" class="card-title">2 · Aplikasi memeriksa file</text>
  <text x="104" y="740" class="body">Format, sheet, dan kolom yang diperlukan diperiksa.</text>
  <text x="104" y="785" class="small">Recon harus punya Summary dan Records.</text>
  <text x="104" y="823" class="small">Backdate harus punya LB, RB, dan RECON.</text>
  <text x="104" y="870" class="small">Jika tidak sesuai, aplikasi meminta file diperbaiki.</text>

  <rect x="940" y="640" width="790" height="280" rx="22" class="card"/>
  <rect x="940" y="640" width="790" height="62" rx="22" fill="#e6f4ff"/>
  <rect x="940" y="680" width="790" height="22" fill="#e6f4ff"/>
  <text x="974" y="680" class="card-title">3 · Tinjau di Preview</text>
  <text x="974" y="740" class="body">Lihat LB, RB, Recon, dan sheet Backdate.</text>
  <text x="974" y="785" class="small">Cari data atau telusuri halaman.</text>
  <text x="974" y="823" class="small">Preview hanya untuk melihat; data tidak diedit di sini.</text>
  <text x="974" y="870" class="small" font-weight="700">Jika sudah siap, tekan Generate.</text>
  <path d="M860 780 L925 780" class="green-line"/>

  <!-- Pairing -->
  <path d="M1335 920 L1335 962 L900 962 L900 990" class="green-line"/>
  <rect x="70" y="1000" width="1660" height="310" rx="24" fill="#e9f3f1" stroke="#c1ded6" stroke-width="2"/>
  <text x="900" y="1052" text-anchor="middle" class="section">4 · Generate: aplikasi memasangkan transaksi</text>
  <rect x="110" y="1080" width="740" height="130" rx="18" fill="#fff" stroke="#d1deea" stroke-width="2"/>
  <text x="142" y="1120" class="card-title">BACKDATE</text>
  <text x="142" y="1160" class="small">BO dari sheet RECON ↔ Vendor dari sheet LB/RB</text>
  <text x="142" y="1190" class="tiny">Dipasangkan dalam periode Backdate saja.</text>
  <rect x="950" y="1080" width="740" height="130" rx="18" fill="#fff" stroke="#d1deea" stroke-width="2"/>
  <text x="982" y="1120" class="card-title">ENDDATE</text>
  <text x="982" y="1160" class="small">BO dari Records ↔ Vendor dari Upload LB/RB</text>
  <text x="982" y="1190" class="tiny">Dipasangkan dalam periode Enddate saja.</text>
  <text x="900" y="1254" text-anchor="middle" class="body" font-weight="700">LB dipasangkan dengan LB · RB dipasangkan dengan RB</text>
  <text x="900" y="1286" text-anchor="middle" class="small">Acuan utama: referensi transaksi; pencocokan alternatif memakai rincian transaksi yang tersedia.</text>

  <!-- Output -->
  <path d="M900 1310 L900 1352" class="green-line"/>
  <text x="70" y="1400" class="section">5 · File hasil Excel disimpan di Folder output</text>
  <rect x="70" y="1430" width="800" height="270" rx="22" class="card"/>
  <rect x="70" y="1430" width="800" height="60" rx="22" fill="#e6f4ff"/>
  <rect x="70" y="1470" width="800" height="20" fill="#e6f4ff"/>
  <text x="104" y="1470" class="card-title">SHEET LB · LOKET BAYAR</text>
  <rect x="104" y="1510" width="340" height="130" rx="15" fill="#f0f7ff"/>
  <text x="128" y="1550" class="card-title">KIRI · BO BILLER</text>
  <text x="128" y="1585" class="small">Ref · Amount · rincian fee</text>
  <rect x="496" y="1510" width="340" height="130" rx="15" fill="#effaf7"/>
  <text x="520" y="1550" class="card-title">KANAN · VENDOR LB</text>
  <text x="520" y="1585" class="small">Ref · Tagihan · Total</text>
  <path d="M448 1570 L488 1570" class="green-line"/>
  <text x="104" y="1672" class="tiny">Sisi Vendor menampilkan data sumber LB.</text>

  <rect x="930" y="1430" width="800" height="270" rx="22" class="card"/>
  <rect x="930" y="1430" width="800" height="60" rx="22" fill="#e8f7f2"/>
  <rect x="930" y="1470" width="800" height="20" fill="#e8f7f2"/>
  <text x="964" y="1470" class="card-title">SHEET RB · RAJABILLER</text>
  <rect x="964" y="1510" width="340" height="130" rx="15" fill="#f0f7ff"/>
  <text x="988" y="1550" class="card-title">KIRI · BO BILLER</text>
  <text x="988" y="1585" class="small">Ref · Amount · rincian fee</text>
  <rect x="1356" y="1510" width="340" height="130" rx="15" fill="#effaf7"/>
  <text x="1380" y="1550" class="card-title">KANAN · VENDOR RB</text>
  <text x="1380" y="1585" class="small">Ref · Total / Nominal*</text>
  <path d="M1308 1570 L1348 1570" class="green-line"/>
  <text x="964" y="1672" class="tiny">*RB standar memakai Nominal jika kolom Total tidak tersedia.</text>

  <rect x="70" y="1730" width="1660" height="118" rx="20" fill="#183858"/>
  <text x="900" y="1772" text-anchor="middle" font-size="22" font-weight="700" class="white">Workbook hasil hanya berisi sheet LB dan RB · Backdate muncul sebelum Enddate.</text>
  <text x="900" y="1808" text-anchor="middle" font-size="18" class="white">Transaksi pukul 23:00 ke atas masuk blok “For tomorrow” pada sheet yang sama.</text>
  <text x="900" y="1837" text-anchor="middle" font-size="17" class="white">Nilai BO dan Vendor berdampingan untuk ditinjau; file hasil dan riwayat tersedia di aplikasi.</text>
</svg>
